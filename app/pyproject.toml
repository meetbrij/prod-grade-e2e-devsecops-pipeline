[project]
name = "kyc-document-intelligence"
version = "0.1.0"
description = "Extracts KYC fields from ID documents and proofs of address using Amazon Bedrock."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"eval/*" = ["S311"]

[tool.coverage.run]
source = ["."]
relative_files = true
# Measure the service only; tests, the eval harness and the virtualenv are not source.
omit = ["tests/*", "eval/*", ".venv/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
