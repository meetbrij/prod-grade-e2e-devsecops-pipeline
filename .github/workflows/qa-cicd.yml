name: QA CI/CD Pipeline

# Built incrementally. Current stage: step 1 (Gitleaks secret scan).
# Later steps: Checkov, Trivy FS, lint, tests, SonarQube, build, Docker build,
# Trivy image scan, SBOM, ECR push, manifest update, EKS deploy.

on:
  pull_request:
    branches:
      - qa
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code (including full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Pinned image. Runs as the runner user so git accepts repo ownership.
        # Default exit code (1 on findings) is kept so a leak fails the pipeline.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo \
            --redact \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --verbose

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
