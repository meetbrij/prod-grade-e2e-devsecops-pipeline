name: QA CI/CD Pipeline

# Built incrementally. Current stages: Gitleaks, then Checkov + Trivy FS in
# parallel, lint + tests, SonarCloud analysis, Docker build, then Trivy image scan
# + SBOM in parallel. Later steps: ECR push, manifest update, EKS deploy.

on:
  pull_request:
    branches:
      - qa
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: read

env:
  # While onboarding the scanners, findings are reported but do not fail the run.
  # Set to "true" to make Checkov and Trivy block the pipeline on findings.
  ENFORCE_SCANS: "false"
  # App-agnostic image name; the tag is always the git commit SHA.
  IMAGE_NAME: nodejs-app

concurrency:
  group: qa-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code (including full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Pinned image. Runs as the runner user so git accepts repo ownership.
        # Default exit code (1 on findings) is kept so a leak fails the pipeline.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo \
            --redact \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --verbose

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  checkov-kubernetes:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-24.04
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov~=3.2"

      - name: Run Checkov on Kubernetes manifests
        run: |
          SOFT=""; [ "$ENFORCE_SCANS" != "true" ] && SOFT="--soft-fail"
          mkdir -p reports
          checkov -d k8-manifests --framework kubernetes $SOFT \
            --output cli --output json --output-file-path reports/
          cat reports/results_cli.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-kubernetes-report
          path: reports/
          if-no-files-found: ignore

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-24.04
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov~=3.2"

      - name: Run Checkov on Dockerfile
        run: |
          SOFT=""; [ "$ENFORCE_SCANS" != "true" ] && SOFT="--soft-fail"
          mkdir -p reports
          checkov -f Dockerfile --framework dockerfile $SOFT \
            --output cli --output json --output-file-path reports/
          cat reports/results_cli.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: reports/
          if-no-files-found: ignore

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-24.04
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect Terraform files
        id: tf
        run: |
          if [ -n "$(find . -name '*.tf' -not -path './.git/*' | head -1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Terraform files yet; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Python
        if: steps.tf.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        if: steps.tf.outputs.found == 'true'
        run: pip install "checkov~=3.2"

      - name: Run Checkov on Terraform
        if: steps.tf.outputs.found == 'true'
        run: |
          SOFT=""; [ "$ENFORCE_SCANS" != "true" ] && SOFT="--soft-fail"
          mkdir -p reports
          checkov -d terraform --framework terraform $SOFT \
            --output cli --output json --output-file-path reports/
          cat reports/results_cli.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.tf.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: reports/
          if-no-files-found: ignore

  trivy-fs-client:
    name: Trivy FS Scan (client)
    runs-on: ubuntu-24.04
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        run: |
          EXIT=0; [ "$ENFORCE_SCANS" = "true" ] && EXIT=1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/src" -w /src \
            aquasec/trivy:0.57.1 fs \
            --cache-dir /tmp/trivy-cache \
            --scanners vuln --severity HIGH,CRITICAL --exit-code "$EXIT" \
            --format table --output trivy-client.txt client
          cat trivy-client.txt
          { echo '```'; cat trivy-client.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-client-report
          path: trivy-client.txt
          if-no-files-found: ignore

  trivy-fs-server:
    name: Trivy FS Scan (server)
    runs-on: ubuntu-24.04
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        run: |
          EXIT=0; [ "$ENFORCE_SCANS" = "true" ] && EXIT=1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/src" -w /src \
            aquasec/trivy:0.57.1 fs \
            --cache-dir /tmp/trivy-cache \
            --scanners vuln --severity HIGH,CRITICAL --exit-code "$EXIT" \
            --format table --output trivy-server.txt server
          cat trivy-server.txt
          { echo '```'; cat trivy-server.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-server-report
          path: trivy-server.txt
          if-no-files-found: ignore

  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-24.04
    needs: [checkov-kubernetes, checkov-dockerfile, checkov-terraform, trivy-fs-client, trivy-fs-server]
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Passes trivially until the app defines a "lint" script.
      - name: Run lint
        run: npm run lint --if-present

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-24.04
    needs: [checkov-kubernetes, checkov-dockerfile, checkov-terraform, trivy-fs-client, trivy-fs-server]
    strategy:
      fail-fast: false
      matrix:
        app: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Passes trivially until the app defines a "test" script.
      - name: Run tests
        run: npm test --if-present

  sonarcloud:
    name: SonarCloud Analysis Report
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - name: Checkout source code (full history for blame and new-code detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Project settings (keys, sources, exclusions) live in sonar-project.properties.
      # The quality gate only blocks the run when ENFORCE_SCANS is "true";
      # until then the gate result is visible in SonarCloud but does not fail the job.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=${{ env.ENFORCE_SCANS }}

  docker-build:
    name: Docker Build Image
    runs-on: ubuntu-24.04
    needs: [lint, test, sonarcloud]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # The Dockerfile compiles the client, so no separate client build job is needed.
      - name: Build image (tagged with git SHA)
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Save image as archive
        run: docker save -o image.tar "$IMAGE_NAME:${{ github.sha }}"

      # The exact image built here is what gets scanned and later pushed (build once).
      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    needs: docker-build
    steps:
      - name: Download image archive
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Run Trivy image scan
        run: |
          EXIT=0; [ "$ENFORCE_SCANS" = "true" ] && EXIT=1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" -w /work \
            aquasec/trivy:0.57.1 image \
            --cache-dir /tmp/trivy-cache \
            --input image.tar \
            --scanners vuln --severity HIGH,CRITICAL --exit-code "$EXIT" \
            --format table --output trivy-image.txt
          cat trivy-image.txt
          { echo '```'; cat trivy-image.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.txt
          if-no-files-found: ignore

  sbom:
    name: SBOM Report Generation
    runs-on: ubuntu-24.04
    needs: docker-build
    steps:
      - name: Download image archive
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Generate CycloneDX SBOM with Trivy
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" -w /work \
            aquasec/trivy:0.57.1 image \
            --cache-dir /tmp/trivy-cache \
            --input image.tar \
            --format cyclonedx --output sbom.cdx.json
          echo "SBOM generated: $(wc -c < sbom.cdx.json) bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
