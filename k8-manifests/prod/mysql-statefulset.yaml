apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: prod
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Official mysql image pinned by version tag; digest pinning is parked"
    checkov.io/skip2: "CKV_K8S_15=The mysql image is pinned to a version tag, so the pull policy default is acceptable"
    checkov.io/skip3: "CKV_K8S_35=Credentials arrive via External Secrets envFrom; the mysql image reads env vars"
    checkov.io/skip4: "CKV_K8S_22=The official mysql image writes to its root filesystem; data is on the PVC"
    checkov.io/skip5: "CKV_K8S_40=Runs as UID 999, the mysql user of the official image; the data directory ownership depends on it"
    checkov.io/skip6: "CKV2_K8S_6=NetworkPolicies are parked; see docs/security-gates.md"
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        storageClassName: ebs-sc-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
