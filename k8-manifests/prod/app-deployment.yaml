apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: prod
  annotations:
    checkov.io/skip1: "CKV_K8S_14=Tag is the git SHA, injected by kustomize at deploy time; the committed name is a placeholder"
    checkov.io/skip2: "CKV_K8S_43=Images are promoted by immutable SHA tag (ECR tags are immutable); a digest would break retag promotion"
    checkov.io/skip3: "CKV_K8S_35=Secrets arrive via External Secrets envFrom; mounting as files is a later hardening item"
    checkov.io/skip4: "CKV2_K8S_6=NetworkPolicies are parked; see docs/security-gates.md"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      # IRSA: this service account is annotated with the IAM role that may call Bedrock
      # (created by Terraform in the app-env module). AWS credentials arrive through a
      # projected token, so the default Kubernetes API token stays unmounted.
      serviceAccountName: kyc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nodejs-app
          # The image name and tag are rewritten by kustomization.yaml (images:).
          # The pipeline sets the registry and the git SHA tag at deploy time.
          image: nodejs-app
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOME
              value: /tmp
            - name: DB_HOST
              value: mysql
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: AWS_REGION
              value: ap-south-1
            # India-only inference profile: inference stays in ap-south-1 / ap-south-2.
            - name: BEDROCK_MODEL_ID
              value: in.anthropic.claude-haiku-4-5-20251001-v1:0
            # Which model API answers. `anthropic` is the demo setting (documents leave AWS, so
            # use synthetic ones only). For data residency set LLM_PROVIDER=bedrock: nothing else
            # changes, the IRSA role and the India-only profile above are already in place.
            - name: LLM_PROVIDER
              value: anthropic
            - name: ANTHROPIC_MODEL
              value: claude-haiku-4-5
            # Only needed while LLM_PROVIDER=anthropic; the service refuses to start without it.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: ANTHROPIC_API_KEY
                  optional: true
            # Not optional: if the secret is missing the pod does not start, so the API is never
            # exposed without its key (fails closed).
            - name: KYC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-api-key
                  key: KYC_API_KEY
            - name: LOG_LEVEL
              value: INFO
            # Traces go to Tempo (OTLP over HTTP).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /healthz answers 200 only when the database is reachable. The startup probe gives the
          # app time to wait for MySQL on a cold start before liveness checks begin.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
