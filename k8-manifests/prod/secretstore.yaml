# Tells External Secrets Operator how to reach AWS Secrets Manager from this namespace.
# Auth is via the namespace's own "eso" service account, which Terraform annotated with an
# IAM role that can read only prod/mysql-secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso
