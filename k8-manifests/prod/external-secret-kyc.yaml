# Two small Secrets for the KYC service, each synced from its own Secrets Manager secret
# (set by hand once, see docs/runbook.md). Kept separate from mysql-secret so a missing or
# rotated key never touches the database credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kyc-api-key
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: kyc-api-key
    creationPolicy: Owner
  data:
    - secretKey: KYC_API_KEY
      remoteRef:
        key: prod/kyc-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-key
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: llm-api-key
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: prod/llm-api-key
