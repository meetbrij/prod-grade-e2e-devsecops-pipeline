# Copies every key of the Secrets Manager secret qa/mysql-secret into a Kubernetes Secret
# named mysql-secret, and refreshes it hourly. Used by the app and MySQL via envFrom/secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-external-secret
  namespace: qa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: qa/mysql-secret
